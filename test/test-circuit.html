<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electrical Single-Line Diagram Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .component {
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .component:hover {
        filter: brightness(1.2);
      }
      .energized {
        stroke: #4caf50;
      }
      .de-energized {
        stroke: #f44336;
      }
      .status-panel {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .transformer-box {
        fill: none;
        stroke-width: 2;
      }
      .busbar {
        stroke-width: 3;
      }
      .breaker {
        stroke-width: 0.5;
      }
      .transformer-rating {
        font-size: 12px;
        fill: #4a5568;
      }
      .transformer-group-box {
        stroke: #666;
        stroke-dasharray: 4;
        stroke-width: 1;
        fill: none;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-3xl font-bold text-center mb-8">
        Power Distribution Monitoring System
      </h1>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- SVG Diagram -->
        <div class="lg:col-span-2 bg-white rounded-lg shadow-lg p-4">
          <svg viewBox="0 0 1200 600" class="w-full">
            <text x="50" y="170" class="text-sm"> Kesicili Giriş Hücresi</text>
            <rect x="60" y="180" width="80" height="300" class="transformer-group-box"></rect>
            <!-- Main Input Circuit Breaker -->
            <g
              id="mainCB"
              class="component breaker de-energized"
              onclick="toggleMainCB()"
            >
            <line x1="50" y1="200" x2="100" y2="200" stroke-width="2"></line>
              <line x1="100" y1="200" x2="100" y2="250" stroke-width="2"></line>
              <rect
                x="90"
                y="250"
                width="20"
                height="20"
                fill="white"
                stroke-width="2"
              ></rect>
              <text x="70" y="270" class="text-sm">26.4kV, 630A</text>  
          </g>

            <!-- Load Disconnect & Measurement -->
          <g
              id="loadDisconnect"
              class="component de-energized"
              onclick="toggleLoadDisconnect()"
            >
            <line x1="100" y1="270" x2="100" y2="380" stroke-width="2"></line>

            <rect x="90" y="380" width="20" height="20" fill="white" stroke-width="2"></rect><!-- TMS -->
              <circle cx="100" cy="390" r="10" fill="#FFF"></circle>
              <text x="95" y="395" class="text-sm">M</text>
              <text x="10" y="405" class="text-sm">Motorized</text>

          <circle cx="100" cy="310" r="8" fill="white" stroke-width="2"></circle>
          <line x1="95" y1="310" x2="105" y2="310" stroke-width="2"></line>
          <line x1="100" y1="320" x2="100" y2="340" stroke-width="2"></line>
            <g>
              <line x1="100" y1="400" x2="100" y2="440" stroke-width="2"></line>
              <line x1="85" y1="440" x2="180" y2="440" stroke-width="2"></line>
              <line x1="180" y1="440" x2="180" y2="200" stroke-width="2"></line>
            </g>
          </g>
          <g
            id="topraklama"
            class="component de-energized"
            onclick="toggleTopraklama()"
            >
          <!-- Topraklama-->
          <line x1="70" y1="440" x2="85" y2="430" stroke-width="2" class="de-energized"></line>
          <line x1="70" y1="440" x2="70" y2="450" stroke-width="2" class="de-energized"></line>
          <line x1="60" y1="450" x2="80" y2="450" stroke-width="2" class="de-energized"></line>
          <line x1="63" y1="455" x2="77" y2="455" stroke-width="2" class="de-energized"></line>
          <line x1="66" y1="460" x2="74" y2="460" stroke-width="2" class="de-energized"></line>
          <!-- /Topraklama-->
        </g>
            <g id="TMSwithEngine" class="component de-energized" onclick="toggleTMSwithEngine()">
              <line x1="180" y1="200" x2="180" y2="220" stroke-width="2"></line>
              <rect x="170" y="220" width="20" height="20" fill="white" stroke-width="2"></rect>
              <circle cx="180" cy="230" r="10" fill="#FFF"></circle>
              <text x="175" y="235" class="text-sm">M</text>
              <text x="190" y="230" class="text-sm">Motorized</text>
            </g>

            <!-- Main Busbar -->
            <g
              id="mainBusbar"
              class="component busbar de-energized"
              onclick="toggleBusbar()"
            >
              <line x1="180" y1="200" x2="900" y2="200" stroke-width="3"></line>
            </g>

            <!-- Transformers and their Circuit Breakers -->
            <g id="transformerGroups">
              <!-- Transformer 1 -->
            </g>

            <rect x="160" y="180" width="80" height="300" class="transformer-group-box"></rect>

          </svg>
        </div>

        <!-- Status Panel -->
        <div class="status-panel">
          <h2 class="text-xl font-bold mb-4">System Status</h2>
          <!-- System Power Summary -->
          <div class="bg-blue-100 p-3 rounded mb-4">
            <h3 class="font-semibold mb-2">System Power</h3>
            <div class="grid grid-cols-2 gap-2">
              <div>Total Power:</div>
              <div id="totalPower">0 kVA</div>
              <div>Input Current:</div>
              <div id="inputCurrent">0 A</div>
              <div>Power Factor:</div>
              <div id="powerFactor">0.95</div>
            </div>
          </div>
          <!-- Component Status -->
          <div id="statusList" class="space-y-2">
            <!-- Status items will be added here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const transformers = Array.from({ length: 5 }, (_, i) => {
          const xOffset = (i) * 120+ 160;

          return `
          <g class="transformer-unit" transform="translate(${xOffset}, 0)">
            <!-- Group Box -->
            <text x="180" y="170" class="text-sm"> Trafo ${i + 1}</text>
            <rect x="160" y="180" width="80" height="300" class="transformer-group-box"></rect>

            <!-- Main CB -->
            <g id="cb${
              i + 2
            }" class="component breaker de-energized" onclick="toggleTransformer(${
            i + 1
          })">
              <line x1="200" y1="200" x2="200" y2="220" stroke-width="2"></line>
              <rect x="190" y="220" width="20" height="20" fill="white" stroke-width="2"></rect>
              <line x1="200" y1="240" x2="200" y2="250" stroke-width="2"></line>
            </g>

            

            <!-- Manual Disconnector -->
            <g id="disconnector${
              i + 2
            }" class="component breaker de-energized" onclick="toggleDisconnector(${
            i + 1
          })">
          <line x1="200" y1="250" x2="200" y2="320" stroke-width="2"></line>
          <circle cx="200" cy="310" r="8" fill="white" stroke-width="2"></circle>
          <line x1="195" y1="310" x2="205" y2="310" stroke-width="2"></line>
          <line x1="200" y1="320" x2="200" y2="350" stroke-width="2"></line>
            </g>
            <!-- Motorized Circuit Breaker (TMŞ) -->
            <g id="tms${
              i + 2
            }" class="component breaker de-energized" onclick="toggleTMS(${
            i + 1
          })">
              <rect x="190" y="350" width="20" height="20" fill="white" stroke-width="2"></rect>
              <circle cx="200" cy="360" r="10" fill="#FFF"></circle>
              <text x="195" y="365" class="text-sm">M</text>
              <text x="200" y="375" class="text-sm">Motorized</text>
            </g>


              <line x1="200" y1="370" x2="200" y2="420" stroke-width="2" class="de-energized"></line>

              <!-- Topraklama -->
              <g id="topraklama${i + 2}" class="component de-energized" onclick="toggleTopraklama()">
              <line x1="195" y1="420" x2="200" y2="420" stroke-width="2" class="de-energized"></line>
              <line x1="180" y1="420" x2="195" y2="410" stroke-width="2" class="de-energized"></line>
              <line x1="180" y1="420" x2="180" y2="430" stroke-width="2" class="de-energized"></line>
              <line x1="170" y1="430" x2="190" y2="430" stroke-width="2" class="de-energized"></line>
              <line x1="173" y1="435" x2="187" y2="435" stroke-width="2" class="de-energized"></line>
              <line x1="176" y1="440" x2="184" y2="440" stroke-width="2" class="de-energized"></line>
            </g>
          </g>
        `;
        }).join("\n");

        const svg = `
        <svg width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
          ${transformers}
        </svg>
      `;

        document.getElementById("transformerGroups").innerHTML = svg;
      });

      const components = {
        mainCB: {
          state: false,
          name: "Main Circuit Breaker",
          dependencies: [],
          voltage: 26.4, // kV
        },
        loadDisconnect: {
          state: false,
          name: "Load Disconnect",
          dependencies: ["mainCB"],
        },
        TMSwithEngine: {
          state: false,
          name: "TMS with Engine",
          dependencies: ["loadDisconnect"],
        },
        topraklama: Array(6).fill().map((_, i) => ({
          state: false,
          name: `Topraklama ${i + 1}`,
          dependencies: ["loadDisconnect"],
        })),
        mainBusbar: {
          state: false,
          name: "Main Busbar",
          dependencies: ["loadDisconnect"],
        },
        transformers: Array(6)
          .fill()
          .map((_, i) => ({
            state: false,
            name: `Transformer ${i + 1}${
              i === 0 ? " (1250 kVA)" : " (1600 kVA)"
            }`,
            dependencies: ["mainBusbar"],
            rating: i === 0 ? 1250 : 1600, // kVA
            current: 0,
            power: 0,
            tms: { state: false, name: `TMŞ ${i + 1}` },
            disconnector: {
              state: false,
              name: `Manual Disconnector ${i + 1}`,
            },
          })),
      };

      function updateStatus() {
        const statusList = document.getElementById("statusList");
        statusList.innerHTML = "";

        // Calculate system power
        let totalPower = 0;
        let totalCurrent = 0;
        const powerFactor = 0.95;

        if (
          components.mainCB.state &&
          components.loadDisconnect.state &&
          components.mainBusbar.state
        ) {
          components.transformers.forEach((transformer) => {
            // Check if all components in the transformer circuit are energized
            const isFullyEnergized =
              transformer.state &&
              transformer.tms.state &&
              transformer.disconnector.state;

            if (isFullyEnergized) {
              transformer.power = transformer.rating;
              transformer.current =
                transformer.rating / (Math.sqrt(3) * components.mainCB.voltage);
              totalPower += transformer.power;
              totalCurrent += transformer.current;
            } else {
              transformer.power = 0;
              transformer.current = 0;
            }
          });
        }

        // Update power summary
        document.getElementById(
          "totalPower"
        ).textContent = `${totalPower.toFixed(1)} kVA`;
        document.getElementById(
          "inputCurrent"
        ).textContent = `${totalCurrent.toFixed(1)} A`;
        document.getElementById("powerFactor").textContent =
          powerFactor.toFixed(2);

        // Add main components status
        addStatusItem(components.mainCB.name, components.mainCB.state);
        addStatusItem(
          components.loadDisconnect.name,
          components.loadDisconnect.state
        );
        addStatusItem(components.mainBusbar.name, components.mainBusbar.state);

        // Add transformer status with power info
        components.transformers.forEach((transformer, i) => {
          const isFullyEnergized =
            transformer.state &&
            transformer.tms.state &&
            transformer.disconnector.state;

          const status = isFullyEnergized ? "ENERGIZED" : "DE-ENERGIZED";
          const power = transformer.power.toFixed(1);
          const current = transformer.current.toFixed(1);

          const item = document.createElement("div");
          item.className = `flex justify-between items-center p-2 ${
            isFullyEnergized ? "bg-green-100" : "bg-red-100"
          } rounded`;
          item.innerHTML = `
                    <div>
                        <div class="font-medium">${transformer.name}</div>
                        <div class="text-sm">
                            <div>TMŞ: ${
                              transformer.tms.state ? "ON" : "OFF"
                            }</div>
                            <div>Disconnector: ${
                              transformer.disconnector.state ? "CLOSED" : "OPEN"
                            }</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="font-semibold">${status}</span>
                        ${
                          isFullyEnergized
                            ? `
                        <div class="text-sm">
                            <div>Power: ${power} kVA</div>
                            <div>Current: ${current} A</div>
                        </div>
                        `
                            : ""
                        }
                    </div>
                `;
          statusList.appendChild(item);
        });
      }

      function addStatusItem(name, state) {
        const statusList = document.getElementById("statusList");
        const item = document.createElement("div");
        item.className = `flex justify-between items-center p-2 ${
          state ? "bg-green-100" : "bg-red-100"
        } rounded`;
        item.innerHTML = `
                <span>${name}</span>
                <span class="font-bold ${
                  state ? "text-green-600" : "text-red-600"
                }">
                    ${state ? "ENERGIZED" : "DE-ENERGIZED"}
                </span>
            `;
        statusList.appendChild(item);
      }

      function toggleComponent(id) {
        const component = components[id];
        if (!component) return;

        // Check dependencies
        const canToggle = component.dependencies.every((dep) => {
          if (components[dep]) return components[dep].state;
          return false;
        });

        if (!canToggle && !component.state) {
          alert("Cannot energize component. Check dependencies.");
          return;
        }

        component.state = !component.state;

        // Update visual state
        const element = document.getElementById(id);
        if (element) {
          element.classList.toggle("energized");
          element.classList.toggle("de-energized");
        }

        // Update dependent components
        updateDependents(id, component.state);
        updateStatus();
      }

      function updateDependents(id, state) {
        if (!state) {
          // If a component is turned off, turn off all dependent components
          Object.entries(components).forEach(([key, component]) => {
            if (Array.isArray(component)) {
              component.forEach((item, i) => {
                if (item.dependencies.includes(id)) {
                  item.state = false;
                  const element = document.getElementById(
                    `transformer${i + 1}`
                  );
                  if (element) {
                    element.classList.remove("energized");
                    element.classList.add("de-energized");
                  }
                  const cb = document.getElementById(`cb${i + 1}`);
                  if (cb) {
                    cb.classList.remove("energized");
                    cb.classList.add("de-energized");
                  }
                }
              });
            } else if (component.dependencies.includes(id)) {
              component.state = false;
              const element = document.getElementById(key);
              if (element) {
                element.classList.remove("energized");
                element.classList.add("de-energized");
              }
              updateDependents(key, false);
            }
          });
        }
      }

      function toggleMainCB() {
        toggleComponent("mainCB");
      }

      function toggleTopraklama() {
        toggleComponent("topraklama");
      }

      function toggleTMSwithEngine() {
        toggleComponent("TMSwithEngine");
      }

      function toggleLoadDisconnect() {
        toggleComponent("loadDisconnect");
      }

      function toggleTransformer(index) {
        if (components.transformers[index]) {
          components.transformers[index].state =
            !components.transformers[index].state;

          // Update transformer visuals
          const transformer = document.getElementById(
            `transformer${index + 1}`
          );
          const cb = document.getElementById(`cb${index + 1}`);

          if (transformer && cb) {
            if (components.transformers[index].state) {
              transformer.classList.add("energized");
              transformer.classList.remove("de-energized");
              cb.classList.add("energized");
              cb.classList.remove("de-energized");
            } else {
              transformer.classList.remove("energized");
              transformer.classList.add("de-energized");
              cb.classList.remove("energized");
              cb.classList.add("de-energized");
            }
          }

          updateStatus();
        }
      }

      function toggleTMS(index) {
        if (components.transformers[index]) {
          const transformer = components.transformers[index];
          transformer.tms.state = !transformer.tms.state;

          // Update visual state
          const tms = document.getElementById(`tms${index + 1}`);
          if (tms) {
            if (transformer.tms.state) {
              tms.classList.add("energized");
              tms.classList.remove("de-energized");
            } else {
              tms.classList.remove("energized");
              tms.classList.add("de-energized");
            }
          }

          updateStatus();
        }
      }

      function toggleDisconnector(index) {
        if (components.transformers[index]) {
          const transformer = components.transformers[index];
          transformer.disconnector.state = !transformer.disconnector.state;

          // Update visual state
          const disconnector = document.getElementById(
            `disconnector${index + 1}`
          );
          if (disconnector) {
            if (transformer.disconnector.state) {
              disconnector.classList.add("energized");
              disconnector.classList.remove("de-energized");
            } else {
              disconnector.classList.remove("energized");
              disconnector.classList.add("de-energized");
            }
          }

          updateStatus();
        }
      }

      function toggleBusbar() {
        if (components.loadDisconnect.state) {
          components.mainBusbar.state = !components.mainBusbar.state;
          const busbar = document.getElementById("mainBusbar");
          if (busbar) {
            if (components.mainBusbar.state) {
              busbar.classList.add("energized");
              busbar.classList.remove("de-energized");
            } else {
              busbar.classList.remove("energized");
              busbar.classList.add("de-energized");
              // De-energize all dependent components
              deEnergizeDependents("mainBusbar");
            }
          }
          updateStatus();
        } else {
          alert(
            "Cannot energize busbar. Load Disconnect must be energized first."
          );
        }
      }

      function deEnergizeDependents(id) {
        Object.entries(components).forEach(([key, component]) => {
          if (Array.isArray(component)) {
            component.forEach((item, i) => {
              if (item.dependencies.includes(id)) {
                item.state = false;
                const element = document.getElementById(`transformer${i + 1}`);
                if (element) {
                  element.classList.remove("energized");
                  element.classList.add("de-energized");
                }
                const cb = document.getElementById(`cb${i + 1}`);
                if (cb) {
                  cb.classList.remove("energized");
                  cb.classList.add("de-energized");
                }
              }
            });
          } else if (component.dependencies.includes(id)) {
            component.state = false;
            const element = document.getElementById(key);
            if (element) {
              element.classList.remove("energized");
              element.classList.add("de-energized");
            }
            deEnergizeDependents(key);
          }
        });
      }

      // Initialize status panel
      updateStatus();
    </script>
  </body>
</html>
