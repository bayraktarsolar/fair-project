<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektrik Dağıtım Şeması Simülasyonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-6">
        <!-- Başlık -->
        <h1 class="text-3xl font-bold mb-6 text-center">Elektrik Dağıtım Şeması</h1>

        <!-- Kontrol Paneli -->
        <div class="bg-white rounded-lg p-4 mb-6 shadow-lg">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Kesici Durumu</label>
                    <select id="circuitBreakerState" class="w-full p-2 border rounded">
                        <option value="kapali">Kapalı</option>
                        <option value="acik">Açık</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Akım Değeri (A)</label>
                    <input type="number" id="currentValue" value="630" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Gerilim Değeri (V)</label>
                    <input type="number" id="voltageValue" value="26400" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Trafo Kapasitesi (kVA)</label>
                    <select id="transformerCapacity" class="w-full p-2 border rounded">
                        <option value="1250">1250 kVA</option>
                        <option value="1600">1600 kVA</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg p-6 shadow-lg flex justify-center">
            <svg width="100%" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" class="max-w-4xl">
                <!-- Giriş Kesici -->
                <g id="inputBreaker" transform="translate(50,250)" class="cursor-pointer">
                    <rect width="60" height="40" class="fill-gray-200 rounded-lg"/>
                    <rect id="breakerContact" x="20" y="15" width="5" height="10" class="fill-green-500"/>
                    <text x="10" y="60" font-size="12" class="fill-gray-700">Giriş Kesici</text>
                </g>
        
                <!-- Trafo -->
                <g transform="translate(200,250)">
                    <rect width="100" height="80" class="fill-gray-200 rounded-lg"/>
                    <text x="220" y="270" font-size="12" class="fill-gray-700">Trafo</text>
                </g>
        
                <!-- Çıkış Kesicileri -->
                <g transform="translate(350,250)" class="cursor-pointer">
                    <rect width="80" height="60" class="fill-gray-200 rounded-lg transition-all duration-300 ease-in-out hover:fill-red-500"/>
                    <text x="360" y="260" font-size="12" class="fill-gray-700">Kesici 1</text>
                </g>
                <g transform="translate(450,250)" class="cursor-pointer">
                    <rect width="80" height="60" class="fill-gray-200 rounded-lg transition-all duration-300 ease-in-out hover:fill-red-500"/>
                    <text x="460" y="260" font-size="12" class="fill-gray-700">Kesici 2</text>
                </g>
                <g transform="translate(550,250)" class="cursor-pointer">
                    <rect width="80" height="60" class="fill-gray-200 rounded-lg transition-all duration-300 ease-in-out hover:fill-red-500"/>
                    <text x="560" y="260" font-size="12" class="fill-gray-700">Kesici 3</text>
                </g>
            </svg>
        </div>
        

        <!-- Dashboard -->
        <div class="bg-white rounded-lg p-6 shadow-lg mt-6">
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-blue-100 p-4 rounded">
                    <h3 class="font-medium mb-2">Toplam Akım</h3>
                    <p id="totalCurrent" class="text-2xl">630 A</p>
                </div>
                <div class="bg-green-100 p-4 rounded">
                    <h3 class="font-medium mb-2">Toplam Gerilim</h3>
                    <p id="totalVoltage" class="text-2xl">26.4 kV</p>
                </div>
                <div class="bg-purple-100 p-4 rounded">
                    <h3 class="font-medium mb-2">Toplam Güç</h3>
                    <p id="totalPower" class="text-2xl">0 kW</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Elementlerin durumlarını takip etmek için nesne
        const state = {
            circuitBreakers: [],
            voltage: 26400,
            current: 630,
            power: 0
        };

        // SVG elementlerini seç
        const inputBreaker = document.getElementById('inputBreaker');
        const breakerContact = document.getElementById('breakerContact');
        const totalCurrent = document.getElementById('totalCurrent');
        const totalVoltage = document.getElementById('totalVoltage');
        const totalPower = document.getElementById('totalPower');

        // Değerleri güncelle
        function updateValues() {
            totalCurrent.textContent = `${state.current} A`;
            totalVoltage.textContent = `${state.voltage} V`;
            state.power = (state.voltage * state.current) / 1000;
            totalPower.textContent = `${state.power.toFixed(2)} kW`;
        }

        // Kontroller
        document.getElementById('circuitBreakerState').addEventListener('change', function() {
            const state = this.value;
            breakerContact.setAttribute('fill', state === 'acik' ? '#ff4444' : '#4CAF50');
            state.circuitBreakers[this.value] = state;
            updateValues();
        });

        document.getElementById('currentValue').addEventListener('input', function() {
            state.current = parseFloat(this.value);
            updateValues();
        });

        document.getElementById('voltageValue').addEventListener('input', function() {
            state.voltage = parseFloat(this.value);
            updateValues();
        });

        // Trafo kapasitesi değiştiğinde
        document.getElementById('transformerCapacity').addEventListener('change', function() {
            const capacity = parseInt(this.value);
            state.transformerCapacity = capacity;
            updateValues();
        });
    </script>
</body>
</html>
